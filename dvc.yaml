stages:
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - src/data/prepare.py
      - data/raw/german_credit.csv
    params:
      - prepare
    outs:
      - data/processed

  train:
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - src/features/build.py
      - data/processed
    params:
      - train
    metrics:
      - reports/metrics.json:
          cache: false

  evaluate:
    cmd: python -m src.models.evaluate
    deps:
      - src/models/evaluate.py
      - reports/metrics.json
    params:
      - evaluate
    outs:
      - reports/promotion.json:
          cache: false