prepare:
  test_size: 0.2
  random_seed: 42
  

train:
  random_seed: 42
  models:
    logistic_regression:
      C: 1.0
      max_iter: 1000
    random_forest:
      n_estimators: 300
      max_depth: 8
      min_samples_leaf: 2
    gradient_boosting:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3


evaluate:
  min_auc: 0.70